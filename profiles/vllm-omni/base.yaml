venv:
- python: 3.14
- package: vllm==0.30.0
- package-script: vllm-omni-aux/utils/install-flashinfer-jit-cache.sh
- package: -e vllm-omni --no-build-isolation
sync:
  vllm: site-package
  vllm-omni: default
  vllm-omni-aux: default
  d3g: default
  python-tracer: push-only
dependencies:
  d3g:
    python-tracer: bash vllm-omni-aux/utils/rebuild-d3g.sh
