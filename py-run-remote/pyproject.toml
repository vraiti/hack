[project]
name = "py-run-remote"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[tool.mypy]
python_version = "3.10"
# run_remote.py imports the sibling ../profile.py (added to sys.path at
# runtime) as `profile` -- that name collides with CPython's own stdlib
# `profile` module, so mypy needs this to resolve it to the local file
# the same way the runtime sys.path.insert() does, instead of the stdlib
# stub.
mypy_path = [".."]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "argcomplete"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ../profile.py is resolved (via mypy_path above) for run_remote.py's import
# of it, but it's unchanged legacy code outside this package's scope --
# don't hold it to this package's checks.
module = "profile"
ignore_errors = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportUnnecessaryTypeIgnoreComment = true
# Same reasoning as [tool.mypy]'s mypy_path: resolves run_remote.py's import
# of the sibling ../profile.py the way the runtime sys.path.insert() does,
# instead of CPython's own stdlib `profile` module of the same name.
extraPaths = [".."]

[tool.pylint.main]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",          # short/terse names (kv, sha, e, f) are used deliberately throughout
    "too-few-public-methods",
]
good-names = ["e", "f", "i", "kv"]
