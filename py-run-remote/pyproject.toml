[project]
name = "py-run-remote"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy",
    "pyright",
    "pylint",
    "types-pyyaml",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "argcomplete"
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pylint.main]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",          # short/terse names (kv, sha, e, f) are used deliberately throughout
    "too-few-public-methods",
    "redefined-outer-name",  # pytest fixtures are meant to shadow by name -- this fires on every one used as a test param
]
good-names = ["e", "f", "i", "kv"]

[tool.pylint.format]
max-line-length = 120  # this codebase favors longer, fully-explained comments over hard-wrapping them
